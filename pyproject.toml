[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-recon"
version = "2.1.0"
description = "CBOM discovery tool for cryptographic assets and secrets"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "CryptoRecon Team"}]
dependencies = [
    "requests>=2.31.0",
    "urllib3>=2.0.0",
    "sslyze>=5.2.0",
    "rich>=13.0.0",
    "dnspython>=2.4.0",
    "beautifulsoup4>=4.12.0",
    "tomli>=2.0.0; python_version < '3.11'",
]
keywords = ["cbom", "crypto", "security", "inventory", "scanner"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/abdulrafayishaCkER/crypto-asset-scanner"
Repository = "https://github.com/abdulrafayishaCkER/crypto-asset-scanner"

[project.scripts]
cryptorecon = "crypto_recon.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.6.0",
    "mypy>=1.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
