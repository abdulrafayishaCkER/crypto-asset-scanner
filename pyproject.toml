[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-recon"
version = "2.1.0"
description = "Production-ready cryptographic asset & CBOM discovery tool"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "CryptoRecon Team"}]
keywords = ["security", "cbom", "cryptography", "tls", "certificate", "inventory"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "requests>=2.31.0",
  "urllib3>=2.0.0",
  "sslyze>=5.2.0",
  "rich>=13.0.0",
  "dnspython>=2.4.0",
  "beautifulsoup4>=4.12.0",
]

[project.urls]
Homepage = "https://github.com/abdulrafayishaCkER/crypto-asset-scanner"

[project.scripts]
cryptorecon = "crypto_recon.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
  "mypy>=1.8.0",
  "ruff>=0.5.0",
  "types-requests>=2.31.0.20240406",
]

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
